<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>The Backstage – Event Management & Ticketing Platform</title>
    <meta name="description" content="The Backstage is an all-in-one event management and ticketing platform. Discover, organize, and sell tickets for events — built for Sri Lanka, open to the world." />
    <meta name="keywords" content="event management, ticketing platform, The Backstage, event tickets, Sri Lanka events, online ticketing, event organizer" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://thebkstg.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="The Backstage – Event Management & Ticketing Platform" />
    <meta property="og:description" content="Discover, organize, and sell tickets for events. Built for Sri Lanka, open to the world." />
    <meta property="og:url" content="https://thebkstg.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://thebkstg.com/og-image.jpg" />
    <meta property="og:site_name" content="The Backstage" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="en_LK" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Backstage – Event Management & Ticketing Platform" />
    <meta name="twitter:description" content="Discover, organize, and sell tickets for events." />
    <meta name="twitter:image" content="https://thebkstg.com/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "The Backstage",
          "url": "https://thebkstg.com",
          "description": "All-in-one event management and ticketing platform, built for Sri Lanka and open to the world.",
          "foundingLocation": {
            "@type": "Country",
            "name": "Sri Lanka"
          }
        },
        {
          "@type": "WebSite",
          "name": "The Backstage",
          "url": "https://thebkstg.com"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
